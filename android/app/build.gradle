plugins { id 'com.android.application' }
android {
    namespace 'com.fisitaap.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fisitaap.android'
        minSdk 26
        targetSdk 35
        versionCode 10709
        versionName '1.7.9'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        release {
            if (System.getenv('FISITAAP_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('FISITAAP_ANDROID_KEYSTORE'))
                storePassword System.getenv('FISITAAP_ANDROID_STORE_PASSWORD')
                keyAlias 'fisitaap'
                keyPassword System.getenv('FISITAAP_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    // Optional local test CA overlay applies only to debug APKs, never to release.
    if (System.getenv('FISITAAP_ANDROID_TEST_OVERLAY')) {
        sourceSets.debug {
            manifest.srcFile System.getenv('FISITAAP_ANDROID_TEST_OVERLAY') + '/AndroidManifest.xml'
            res.srcDir System.getenv('FISITAAP_ANDROID_TEST_OVERLAY') + '/res'
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach {
    // Keep Robolectric's SDK locks, downloads and native graphics cache in the test profile.
    def testHome = new File(gradle.gradleUserHomeDir, 'test-user')
    doFirst { testHome.mkdirs() }
    systemProperty 'user.home', testHome.absolutePath
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','http.nonProxyHosts'].each { key ->
        if (System.getProperty(key)) systemProperty key, System.getProperty(key)
    }
}
tasks.register('buildOfflineAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'build-offline-assets.js'
}
tasks.named('preBuild').configure { dependsOn 'buildOfflineAssets' }
