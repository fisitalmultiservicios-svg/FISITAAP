<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FISITAAP Android · Caja local</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>FISITAAP</strong><span id="businessName">Android principal</span><span id="connectionStatus">Abriendo caja guardada…</span></header><main id="root"></main>
<dialog id="optionsDialog"><form id="optionsForm"><h2 id="optionsTitle"></h2><div id="optionsFields"></div><label>Cantidad<input id="optionsQty" type="number" step=".001" min=".001" required></label><label>Observaciones<input id="optionsNote" maxlength="500"></label><div class="actions"><button>Agregar</button><button type="button" id="closeOptions" class="light">Cancelar</button></div></form></dialog>
<dialog id="receiptDialog"><section id="receipt"></section><div class="actions no-print"><button id="printReceipt">Imprimir</button><button id="closeReceipt" class="light">Cerrar</button></div></dialog><p id="message" role="status" aria-live="polite"></p>
<script src="bcrypt.js"></script><script src="adapter.js"></script><script src="engine.js"></script><script src="start.js"></script></body></html>
