<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impresión · FISITAAP</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>FISITAAP</strong><span>Impresoras de este equipo</span></header><main><section class="card auth"><h1>Conectar la impresión</h1><p>Guarda aquí la dirección de tu web y selecciona la impresora instalada en Windows.</p><p id="bridgeStatus" role="status"></p><button id="retryBridge" type="button" hidden>Reintentar conexión de impresión</button><form id="printSettingsForm"><label>Dirección de la web<input name="origin" type="url" placeholder="https://fisitaap.com" required></label><label>Impresora de este equipo<select name="printer"><option value="">Guardar en PDF</option></select></label><label>Papel<select name="width"><option value="80">80 mm</option><option value="58">58 mm</option></select></label><label>Código para conectar la web<input name="token" readonly></label><p class="small">Copia este código en la web: Administración → Impresión → Token de FISITAAP Print. Cada punto debe usar el nombre exacto de su impresora.</p><button type="submit">Guardar configuración</button></form><p id="printStatus" role="status"></p></section></main><script src="/print-settings.js" defer></script></body></html>
