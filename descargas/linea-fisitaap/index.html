}

body[data-design=fusion]:has(.pos-view) .chat-launch{top:calc(var(--header) + 5px);right:25px;bottom:auto;height:26px;min-height:26px;padding:4px 10px;font-size:10px;border-radius:5px;box-shadow:none}

function formatCell(row,key){if(['price','balance','credit','total','due','limit'].includes(key))return money(row[key]);if(['active','required','available'].includes(key))return `<span class="pill ${row[key]?'green':''}">${row[key]?(key==='required'?'Sí':key==='available'?'Disponible':'Activo'):(key==='required'?'No':key==='available'?'No disponible':'Inactivo')}</span>`;if(key==='percent')return number(row[key])+'%';if(key==='stock')return `<span class="${row.stock<=(row.minimum||0)?'negative':''}">${number(row.stock)} ${row.kind==='bulk'?'kg':'ud.'}</span>`;if(key==='name')return `<div class="product-cell">${row.image?`<img src="${img(row)}" alt="">`:`<span class="avatar">${initial(row.name)}</span>`}<div><strong>${esc(row.name)}</strong>${row.sku?`<small>${esc(row.sku)}</small>`:''}</div></div>`;return esc(row[key]??'—');}

function pos(){const filtered=state.products.filter(p=>p.active&&p.stock>0&&(ui.category==='Todos'||p.category===ui.category)&&p.name.toLowerCase().includes(ui.search.toLowerCase())),pageSize=6,totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));ui.page=Math.min(ui.page,totalPages-1);const cart=state.cart,t=totals(cart);const title=state.tableId?(state.tables.find(x=>x.id===state.tableId)?.name||'Mesa'):'Venta rápida';return `${head(title,'La venta fluye. Tú sigues cerca de tus clientes.',`<div class="terminal-toolbar">${btn(icon('orders')+`<span>Pedidos web</span> ${state.orders.filter(o=>o.status==='Nuevo').length}`,'incoming','')}${ib('full','fullscreen','Pantalla completa')}</div>`)}<div class="pos-mobile-tabs"><button data-action="pos-tab" data-tab="products" class="${ui.posTab==='products'?'active':''}">Productos</button><button data-action="pos-tab" data-tab="ticket" class="${ui.posTab==='ticket'?'active':''}">Mi venta · ${cart.reduce((n,l)=>n+l.qty,0)} · ${money(t.total)}</button></div><div class="pos-layout" data-pos-tab="${ui.posTab}"><section class="pos-products"><div class="filter-bar"><input id="posSearch" data-search class="input" placeholder="Buscar nombre o código…" value="${esc(ui.search)}" aria-label="Buscar productos"><select class="input" id="posCategory" aria-label="Categoría"><option>Todos</option>${state.categories.map(c=>`<option ${c.name===ui.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="product-grid">${filtered.slice(ui.page*pageSize,(ui.page+1)*pageSize).map(p=>`<button class="pos-product" data-action="product-add" data-id="${p.id}" title="Agregar ${esc(p.name)}"><img src="${img(p)}" alt=""><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${number(p.stock)} ${p.kind==='bulk'?'kg':'disponibles'}</small><span class="product-bottom">${money(p.price)}${p.kind==='bulk'?' / kg':''}<span class="product-plus">${icon('plus')}</span></span></button>`).join('')||'<div class="empty">No encontram function driverCard(o){return `<article class="card driver-job"><header><div><p class="eyebrow">LA VENTANITA</p><h2>${esc(o.number)}</h2><p>${esc(o.customer)}</p></div><div style="text-align:right"><b>${money(o.fee)}</b><div>${statusPill(o)}</div></div></header><div class="driver-route"><div><small>Recoger</small><b>Aguas Zarcas · Sucursal principal</b></div><div><small>Entregar</small><b>${esc(o.address)}</b></div></div><div class="hstack between"><span class="small-text muted">${o.paid?'Pedido pagado':'Cobrar pedido: '+money(o.total+o.fee)}</span><span class="small-text">${esc(o.payment)}</span></div>${o.status==='Disponible'?btn('Aceptar Express '+icon('arrow'),'driver-accept','primary',`data-id="${o.id}"`):o.status==='Asignado'?btn('Confirmar recogido','driver-pickup','primary',`data-id="${o.id}"`):o.status==='En camino'?btn('Confirmar entrega con PIN','driver-complete','primary',`data-id="${o.id}"`):btn('Ver trazabilidad','order-detail','',`data-id="${o.id}"`)}</article>`;}
function orderDetail(id){const o=state.orders.find(o=>o.id===id);if(!o)return;const buyer=ui.mode==='catalog';modal(o.number,`<div class="hstack between" style="margin-bottom:20px"><div><b>${esc(o.customer)}</b><div class="muted small-text">${esc(o.phone)} · ${esc(o.delivery==='delivery'?o.address:'Retiro en tienda')}</div></div>${statusPill(o)}</div>${buyer?`<section class="notice"><div class="eyebrow">Tu PIN de entrega</div><div class="pin">${esc(o.pin)}</div><div>Compártelo únicamente cuando recibas el pedido.</div></section>`:''}<div class="detail-items">${o.items.map(l=>`<div><span>${number(l.qty)} × ${esc(l.name)}</span><b>${money(l.qty*l.price)}</b></div>`).join('')}<div><span>Envío</span><b>${money(o.fee)}</b></div><div><span>Total</span><b>${money(o.total+o.fee)}</b></div></div><h3 class="small-text" style="margin:25px 0 18px">Cada paso de tu pedido</h3><div class="timeline">${o.events.map(e=>`<div class="timeline-item"><strong>${esc(e.label)}</strong><small>${stamp(e.at)}</small>${e.note?`<p class="small-text muted">${esc(e.note)}</p>`:''}</div>`).join('')}</div>`,btn('Cerrar','modal-close')+(buyer?btn('Copiar resumen','copy-order','primary',`data-id="${o.id}"`):''));}
function inventory(){return `${head('Existencias con perspectiva.','Lo que tienes, lo que se mueve y lo que conviene reponer.',btn(icon('download')+'Exportar inventario','export','','data-kind="products"'))}<div class="metrics">${metric('Productos activos',state.products.filter(p=>p.active).length,'Catálogo','en esta sucursal','box')}${metric('Existencias',number(state.products.reduce((n,p)=>n+p.stock,0)),'Actualizadas','con cada venta','bag')}${metric('Por reponer',state.products.filter(p=>p.stock<=p.minimum).length,'Mínimos','configurados por producto','bell')}${metric('Valor de venta',money(state.products.reduce((n,p)=>n+p.stock*p.price,0)),'Referencia','según precios de venta','wallet')}</div><section class="card">${table(['Producto','Existencias','Mínimo','Estado',''],state.products.map(p=>[formatCell(p,'name'),formatCell(p,'stock'),number(p.minimum),`<span class="pill ${p.stock<=p.minimum?'amber':'green'}">${p.stock<=p.minimum?'Reponer':'Disponible'}</span>`,btn('Ajustar','stock-adjust','small',`data-id="${p.id}"`)]))}</section>${footer()}`;}
function shifts(){const active=currentShift(),cashSales=state.sales.filter(s=>s.shiftId===active?.id&&s.method==='Efectivo').reduce((n,s)=>n+s.total,0);return `${head('Una caja clara, de principio a fin.','Apertura, movimientos y cierre del turno.',active?btn('Cerrar turno','shift-close','primary'):btn('Abrir turno','shift-open','primary'))}<div class="metrics">${metric('Estado actual',active?'Abierto':'Cerrado',active?'En curso':'Al día',active?'Caja principal':'Sin turno pendiente','clock')}${metric('Fondo de apertura',money(active?.opening||0),'Efectivo','al iniciar','wallet')}${metric('Ventas en efectivo',money(cashSales),String(state.sales.filter(s=>s.shiftId===active?.id).length)+' ventas','en el turno','sales')}${metric('Efectivo esperado',money((active?.opening||0)+cashSales),'A conciliar','al cerrar','credit')}</div><section class="card"><header class="card-header"><h2>Historial de turnos</h2></header>${table(['Turno','Apertura','Fondo','Estado','Cierre contado'],state.shifts.map(s=>[esc(s.name),stamp(s.opened),money(s.opening),`<span class="pill ${s.status==='open'?'green':''}">${s.status==='open'?'Abierto':'Cerrado'}</span>`,s.closed?money(s.counted):'—']))}</section>${footer()}`;}
function collect(){const held=state.held||[],tablesOpen=state.tables.filter(t=>t.cart.length);return `${head('Cuentas por atender.','Encuentra la cuenta y continúa con el cobro.',btn(icon('plus')+'Nueva venta','new-sale','primary'))}<section class="card"><header class="card-header"><h2>Mesas y ventas en espera</h2><span class="pill">${tablesOpen.length+held.length}</span></header>${table(['Cuenta','Productos','Total',''],[...tablesOpen.map(t=>[esc(t.name),t.cart.length,money(totals(t.cart).total),btn('Abrir cuenta','table-open','small primary',`data-id="${t.id}"`)]),...held.map(t=>[esc(t.name),t.cart.length,money(totals(t.cart).total),btn('Continuar venta','held-open','small primary',`data-id="${t.id}"`)])])}</section>${footer()}`;}
function accounts(){return `${head('Tu dinero, en su lugar.','Saldos, cuentas y movimientos de la operación.',btn(icon('plus')+'Crear cuenta','account-new','primary'))}<div class="three-col">${state.accounts.map(a=>`<article class="card account-tile"><div class="hstack between"><span class="eyebrow">${esc(a.kind)}</span>${icon(a.kind==='Banco'?'credit':'wallet')}</div><strong>${money(a.balance)}</strong><small>${esc(a.name)}</small><div class="hstack" style="margin-top:18px">${btn('Registrar movimiento','account-move','small',`data-id="${a.id}"`)}${btn('Ver detalle','account-detail','small quiet',`data-id="${a.id}"`)}</div></article>`).join('')}</div><section class="card" style="margin-top:20px"><header class="card-header"><h2>Movimientos recientes</h2></header>${table(['Concepto','Cuenta','Fecha','Monto'],state.ledger.slice().reverse().map(l=>[esc(l.name),esc(state.accounts.find(a=>a.id===l.accountId)?.name||'Cuenta'),stamp(l.at),`<span class="${l.amount>=0?'positive':'negative'}">${money(l.amount)}</span>`]))}</section>${footer()}`;}
function finance(kind){const receivable=kind==='receivables',items=receivable?state.customers.filter(c=>c.credit>0):state.purchases.filter(p=>p.due>0),total=items.reduce((n,r)=>n+(receivable?r.credit:r.due),0);return `${head(receivable?'Cuentas por cobrar':'Cuentas por pagar',receivable?'Crédito y abonos con una visión clara.':'Compromisos ordenados, relaciones saludables.',btn('Ver '+(receivable?'clientes':'compras'),'route','','data-route="'+(receivable?'customers':'purchases')+'"'))}<div class="metrics">${metric('Saldo pendiente',money(total),items.length+' cuentas','por atender','wallet')}${metric('Movimientos registrados',state.ledger.length,'Bitácora','con trazabilidad','orders')}</div><section class="card">${table([receivable?'Cliente':'Proveedor','Referencia','Saldo',''],items.map(r=>[esc(receivable?r.name:r.provider),esc(receivable?r.phone:r.number),money(receivable?r.credit:r.due),btn(receivable?'Registrar abono':'Registrar pago','finance-pay','small primary',`data-kind="${kind}" data-id="${r.id}"`)]))}</section>${footer()}`;}
function purchases(){return `${head('Compras que sostienen tu negocio.','Planifica, recibe y mantén tu inventario al día.',btn(icon('plus')+'Nueva compra','purchase-new','primary'))}<section class="card">${table(['Compra','Proveedor','Total','Por pagar','Estado',''],state.purchases.map(p=>[esc(p.number),esc(p.provider),money(p.total),money(p.due),`<span class="pill ${p.status==='Recibida'?'green':'amber'}">${esc(p.status)}</span>`,p.status!=='Recibida'?btn('Recibir compra','purchase-receive','small primary',`data-id="${p.id}"`):btn('Ver cuenta','route','small','data-route="payables"')]))}</section>${footer()}`;}
function loyalty(){return `${head('Buenas razones para volver.','Puntos que reconocen la preferencia de tus clientes.',btn('Configurar programa','loyalty-settings'))}<div class="notice">Por cada ₡100 de compra se suma un punto en esta demostración. 100 puntos permiten canjear un descuento de ₡1.000.</div><section class="card">${table(['Cliente','Puntos disponibles','Teléfono',''],state.customers.map(c=>[formatCell(c,'name'),`<b class="mono">${number(c.points)}</b>`,esc(c.phone),btn('Canjear 100 puntos','redeem','small',`data-id="${c.id}" ${c.points<100?'disabled':''}`)]))}</section>${footer()}`;}
function reportSales(){return state.sales.filter(s=>{const day=new Date(s.at).toISOString().slice(0,10);return day>=ui.reportFrom&&day<=ui.reportTo&&(!ui.search||s.customer.toLowerCase().includes(ui.search.toLowerCase()));});}
function reports(){const rows=reportSales();return `${head(ui.mode==='master'?'La plataforma, en números.':'Decidir con información clara.','Ventas y movimientos del espacio de demostración.',btn(icon('download')+'Descargar CSV','export','primary','data-kind="sales"'))}<div class="filter-bar"><input class="input" id="reportFrom" type="date" aria-label="Desde" value="${ui.reportFrom}"><input class="input" id="reportTo" type="date" aria-label="Hasta" value="${ui.reportTo}">${btn('Aplicar período','report-filter')}<span id="reportPeriod" class="muted small-text right">${esc(ui.reportFrom)} → ${esc(ui.reportTo)} · ${rows.length} ventas</span></div><div class="two-col"><section class="card"><header class="card-header"><h2>Ventas por método de pago</h2></header><div class="card-body report-bars">${['Efectivo','SINPE Móvil','Tarjeta','Crédito'].map(m=>{const n=rows.filter(s=>s.method===m).reduce((n,s)=>n+s.total,0);return `<div class="report-bar"><span>${m}</span><i><span style="width:${Math.round(n/Math.max(1,rows.reduce((n,s)=>n+s.total,0))*100)}%"></span></i><b>${money(n)}</b></div>`;}).join('')}</div></section><section class="card"><header class="card-header"><h2>Lo que mueve tu negocio</h2></header><div class="card-body"><div class="stat-row"><span>Ventas completadas</span><b>${rows.length}</b></div><div class="stat-row"><span>Total vendido</span><b>${money(rows.reduce((n,s)=>n+s.total,0))}</b></div><div class="stat-row"><span>Clientes registrados</span><b>${state.customers.length}</b></div></div></section></div><section class="card" style="margin-top:20px"><header class="card-header"><h2>Detalle de ventas</h2><span class="pill">${rows.length}</span></header>${table(['Venta','Cliente','Fecha','Método','Total',''],rows.slice().reverse().map(s=>[esc(s.number),esc(s.customer),stamp(s.at),esc(s.method),money(s.total),btn('Ver recibo','receipt','small',`data-id="${s.id}"`)]))}</section>${footer()}`;}
function settings(kind='settings'){let content='';if(kind==='design'){content=`<div class="notice">Estos colores se aplican al catálogo de la tienda. El panel conserva la identidad de ${esc(CONFIG.name)}.</div><div class="fields">${fieldHtml(['primary','Color principal de la tienda','color'],state.settings)}${fieldHtml(['sliderSeconds','Segundos entre imágenes','number'],state.settings)}</div><div class="three-col" style="margin-top:20px">${state.settings.slides.map((s,i)=>`<div class="card settings-card"><p class="eyebrow">Imagen ${i+1}</p><label class="field">Título<input class="input" name="slideTitle${i}" value="${esc(s.title)}"></label><label class="field" style="margin-top:12px">Texto<textarea class="input" name="slideText${i}">${esc(s.text)}</textarea></label><label class="field" style="margin-top:12px">Foto<input class="input" type="file" name="slideImage${i}" accept="image/jpeg,image/png,image/webp"></label></div>`).join('')}</div><div class="design-preview" style="--accent:${esc(state.settings.primary)}"><div><p class="eyebrow">Así se siente tu tienda</p><h3>${esc(state.settings.slides[0].title)}</h3><p>${esc(state.settings.slides[0].text)}</p>${btn('Abrir catálogo','mode','primary','data-mode="catalog"')}</div><img src="${img(state.settings.slides[0])}" alt="Vista previa del catálogo"></div>`;}else if(kind==='printing'){content=`<div class="fields">${fieldHtml(['printer','Nombre del punto de impresión','text',true],state.settings)}${fieldHtml(['paper','Ancho de papel','select',['58 mm','80 mm']],state.settings)}${fieldHtml(['autoPrint','Preparar comanda al aceptar el pedido','check'],state.settings)}</div><div class="settings-actions">${btn(icon('printer')+'Probar impresión','print-test')}</div>`;}else{content=`<div class="fields">${fieldHtml(['name','Nombre del negocio','text',true],state.settings)}${fieldHtml(['phone','Teléfono','tel',true],state.settings)}${fieldHtml(['email','Correo de contacto','email'],state.settings)}${fieldHtml(['address','Dirección','textarea'],state.settings)}</div><div style="margin-top:20px">${fieldHtml(['webOrders','Recibir pedidos web','check'],state.settings)}${fieldHtml(['notifications','Notificaciones de pedidos','check'],state.settings)}${fieldHtml(['points','Programa de puntos','check'],state.settings)}</div>`;}return `${head(kind==='design'?'Una tienda con tu identidad.':kind==='printing'?'Impresión, punto por punto.':'Los detalles de tu negocio.',kind==='design'?'Tres imágenes, tu color y una experiencia clara.':'Configuraciones sencillas, siempre a mano.')}<form id="settingsForm" data-kind="${kind}" class="card settings-card"><p class="form-error" hidden></p>${content}<div class="settings-actions">${btn('Restaurar formulario','settings-reset')}<button class="btn primary" type="submit">Guardar cambios</button></div></form>${footer()}`;}
function devices(){return `${head('Cada equipo, bien conectado.','Define qué caja conserva la operación sin internet.',btn(icon('plus')+'Vincular equipo','device-new','primary'))}<div class="notice">Un solo equipo principal por negocio. En esta propuesta puedes probar la selección; no se vinculan dispositivos reales.</div><section class="card">${table(['Equipo','Plataforma','Sucursal','Última conexión','Operación',''],state.devices.map(d=>[esc(d.name),esc(d.platform),esc(d.branch),esc(d.last),d.primary?'<span class="pill green">Principal · caja local</span>':'<span class="pill">Con internet</span>',btn(d.primary?'Equipo principal':'Elegir principal','device-primary','small',`data-id="${d.id}" ${d.primary?'disabled':''}`)]))}</section>${footer()}`;}
function modules(){const all=[['tables','Mesas y cocina'],['inventory','Inventario y compras'],['loyalty','Fidelización'],['delivery','Entregas y afiliados']];return `${head('Las herramientas justas.','Configura los módulos de ejemplo del plan Profesional.')}<form id="modulesForm" class="card settings-card"><h2>Plan Profesional</h2><p>Los cambios de esta demostración se reflejan en la navegación del negocio.</p>${all.map(([key,n])=>`<label class="toggle">${n}<input type="checkbox" name="${key}" ${(state.modules?.[key]??true)?'checked':''}></label>`).join('')}<div class="settings-actions"><button class="btn primary" type="submit">Guardar módulos</button></div></form>${footer()}`;}
function contacts(){return `${head('Conversaciones que importan.','Cada consulta es una oportunidad para acompañar.')}<section class="card">${table(['Persona','Asunto','Estado',''],state.contacts.map(c=>[esc(c.name),esc(c.subject),`<span class="pill ${c.status==='Nuevo'?'amber':'green'}">${esc(c.status)}</span>`,btn('Abrir mensaje','contact-detail','small',`data-id="${c.id}"`)]))}</section>${footer()}`;}
function incidents(){return `${head('Resolver también es cuidar.','Revisa incidencias y acompaña cada entrega.')}<section class="card">${table(['Incidencia','Pedido','Detalle','Estado',''],state.incidents.map(i=>[esc(i.title),esc(state.orders.find(o=>o.id===i.orderId)?.number||'—'),esc(i.description),`<span class="pill ${i.status==='Resuelta'?'green':'amber'}">${esc(i.status)}</span>`,btn(i.status==='Resuelta'?'Ver solución':'Resolver','incident-detail','small',`data-id="${i.id}"`)]))}</section>${footer()}`;}
function auditView(){return `${head('Cada cambio deja una huella.','Una bitácora clara de lo que sucede en tu espacio.',btn(icon('download')+'Exportar bitácora','export','','data-kind="audit"'))}<section class="card">${table(['Acción','Detalle','Fecha'],state.audit.map(a=>[esc(a.event),esc(a.detail),stamp(a.at)]))}</section>${footer()}`;}
function updates(){return `${head('Tu sistema, al día.','Un espacio para revisar la versión y elegir el momento de actualizar.')}<section class="card settings-card"><p class="eyebrow">Versión de demostración</p><h2>FISITAAP · Exploración de diseño</h2><p>La demostración reúne los recorridos de operación con datos locales de ejemplo.</p><div class="stat-row"><span>Estado</span><span class="pill green" id="updateStatus">Actualizado</span></div><div class="stat-row"><span>Negocios nuevos</span><b>Comienzan actualizados</b></div><div class="settings-actions">${btn(icon('refresh')+'Buscar actualizaciones','check-update','primary')}</div></section>${footer()}`;}
function driverView(){if(ui.route!=='driver-wallet')return `${head('Buen día, Andrés.','Tu ruta empieza con la información correcta.',`<label class="toggle">Disponible<input type="checkbox" id="driverAvailable" ${state.available?'checked':''}></label>`)}<div class="metrics">${metric('Entregas de hoy',state.orders.filter(o=>o.driverId==='d1'&&o.status==='Entregado').length,'En ruta','cada entrega cuenta','truck')}${metric('Por recibir',money(state.drivers[0].balance),'Acumulado','sin cortes pendientes','wallet')}${metric('Negocios afiliados','1','La Ventanita','Aguas Zarcas','store')}</div>${ordersView(ui.route).replace(/<div class="page-heading">[\s\S]*?<\/div><\/div>/,'')}`;return `${head('Tu trabajo, con cuentas claras.','Historial de entregas y pagos recibidos.')}<div class="metrics">${metric('Saldo pendiente',money(state.drivers[0].balance),'Por liquidar','según tus entregas','wallet')}${metric('Entregas completadas',state.orders.filter(o=>o.driverId==='d1'&&o.status==='Entregado').length,'Con PIN','confirmadas por el cliente','check')}</div><section class="card">${table(['Pedido','Cliente','Fecha','Ganancia'],state.orders.filter(o=>o.driverId==='d1'&&o.status==='Entregado').map(o=>[esc(o.number),esc(o.customer),stamp(o.deliveredAt),money(o.fee*(state.drivers[0].percent/100))]))}</section>${footer()}`;}
function catalog(){const rows=state.products.filter(p=>p.active&&p.stock>0&&(ui.category==='Todos'||p.category===ui.category)&&p.name.toLowerCase().includes(ui.search.toLowerCase()));const slide=state.settings.slides[ui.slide%3];const count=state.shopCart.reduce((n,l)=>n+l.qty,0);return `${head('Tu tienda, cerca de ti.','Aguas Zarcas · retiro y entrega a domicilio.',state.buyer?btn(icon('users')+state.buyer.name.split(' ')[0],'route','','data-route="my-orders"'):btn(icon('users')+'Iniciar sesión de cliente','buyer-login'))}<section class="catalog-intro"><div><p class="eyebrow">LA VENTANITA</p><h1>${esc(slide.title)}</h1><p>${esc(slide.text)}</p><div class="hstack" style="margin-top:15px">${[0,1,2].map(i=>`<button data-action="slide" data-slide="${i}" aria-label="Ver imagen ${i+1}" aria-pressed="${ui.slide===i}" style="width:${ui.slide===i?22:6}px;height:5px;padding:0;background:${ui.slide===i?'var(--accent)':'var(--line)'};border-radius:2px"></button>`).join('')}</div></div><img src="${img(slide)}" alt="Selección de La Ventanita"></section><div class="filter-bar"><div class="chips">${['Todos',...state.categories.map(c=>c.name)].map(c=>`<button class="chip ${ui.category===c?'active':''}" data-action="category" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><input class="input" id="catalogSearch" data-search placeholder="Buscar tu favorito…" value="${esc(ui.search)}" aria-label="Buscar en el catálogo"></div><section class="catalog-grid">${rows.map(p=>`<article class="card catalog-product"><button data-action="product-preview" data-id="${p.id}" aria-label="Ver ${esc(p.name)}"><img src="${img(p)}" alt="${esc(p.name)}"></button><div class="card-body"><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="hstack between"><b class="small-text">${money(p.price)}${p.kind==='bulk'?' / kg':''}</b>${btn(icon('plus')+'<span class="text">Agregar</span>','shop-add','primary',`data-id="${p.id}" aria-label="Agregar ${esc(p.name)}"`)}</div></div></article>`).join('')||'<div class="card empty">No encontramos productos con esa búsqueda.</div>'}</section>${footer()}${count?btn(`<span>Ver mi carrito · ${number(count)}</span><strong>${money(totals(state.shopCart).total)}</strong>`,'route','primary catalog-cart-float','data-route="checkout"'):''}`;}
function checkout(){if(!state.shopCart.length)return `${head('Tu próxima elección empieza aquí.','Agrega tus favoritos y prepara tu pedido.')}<div class="card empty">${icon('bag')}${btn('Explorar catálogo','route','primary','data-route="catalog"')}</div>`;const t=totals(state.shopCart);return `${head('Ya casi está listo.','Revisa tus productos y cuéntanos dónde encontrarte.',btn('Seguir eligiendo','route','','data-route="catalog"'))}<div class="checkout-layout"><form class="card settings-card" id="checkoutForm"><p class="form-error" role="alert" hidden></p><h2>Tu información</h2><p>Nombre y teléfono para acompañar tu pedido.</p><div class="fields">${fieldHtml(['name','Tu nombre','text',true],state.buyer||{})}${fieldHtml(['phone','Teléfono','tel',true],state.buyer||{})}<label class="field">Entrega<select class="input" name="delivery" id="deliverySelect"><option value="pickup">Retiro en tienda</option><option value="delivery">Express · ₡1.500</option></select></label><label class="field">Pago<select class="input" name="payment" id="shopPayment"><option>Efectivo</option><option>SINPE Móvil</option><option>Tarjeta al recibir</option></select></label><div id="savedAddresses" class="wide" hidden></div><div class="wide fields" id="addressFields" hidden>${fieldHtml(['address','Dirección de entrega','textarea'],{address:state.buyer?.address||''})}${fieldHtml(['maps','Ubicación de Google Maps','url'],{maps:state.buyer?.maps||''})}<div class="wide">${btn(icon('pin')+'Usar mi ubicación actual','geolocate','small')}</div></div><label class="field wide" id="proofField" hidden>Comprobante SINPE<input class="input" type="file" name="proof" accept="image/jpeg,image/png,image/webp"><small>El comprobante es obligatorio al elegir SINPE.</small></label><label class="field wide">Notas para tu pedido<textarea class="input" name="notes" placeholder="Un detalle que debamos saber…"></textarea></label></div><div class="settings-actions"><button class="btn primary" type="submit">Confirmar pedido ${icon('arrow')}</button></div></form><aside class="card checkout-summary"><h2>Tu selección</h2>${state.shopCart.map((l,i)=>ticketLine(l,i,'shop')).join('')}<div class="summary-row"><span>Subtotal</span><b>${money(t.total)}</b></div><div class="summary-row"><span>Envío</span><span id="checkoutFee">Sin cargo por retiro</span></div><div class="summary-row total"><span>Total</span><strong id="checkoutTotal">${money(t.total)}</strong></div><p class="tiny muted">Precios con impuestos incluidos. Compra de demostración.</p></aside></div>${footer()}`;}
function buyerAccount(){if(!state.buyer)return `${head('Un espacio para tus pedidos.','Ingresa con tu teléfono de ejemplo para continuar.')}<div class="card empty">${btn('Iniciar sesión de cliente','buyer-login','primary')}</div>`;return `${head('Hola, '+state.buyer.name.split(' ')[0]+'.','Tus datos y direcciones, siempre a mano.',btn('Cerrar sesión','buyer-logout'))}<form class="card settings-card" id="buyerForm"><div class="fields">${[['name','Nombre','text',true],['phone','Teléfono','tel',true],['address','Dirección principal','textarea'],['maps','Ubicación de Google Maps','url']].map(f=>fieldHtml(f,state.buyer)).join('')}</div><div class="settings-actions"><button class="btn primary" type="submit">Guardar mis datos</button></div></form>${footer()}`;}
function renderView(){clearInterval(slideTimer);const view=$('#view');view.className='view'+(ui.route==='pos'?' pos-view':'')+(ui.mode==='catalog'?' catalog-scope':'');$('#breadcrumbTitle').textContent=label();let html='';if(ui.mode==='driver')html=driverView();else if(entities[ui.route])html=entityView(ui.route);else switch(ui.route){case'overview':html=dashboard();break;case'pos':html=pos();break;case'tables':html=tables();break;case'collect':html=collect();break;case'orders':case'kitchen':case'express':case'delivery-history':case'my-orders':html=ordersView(ui.route);break;case'inventory':html=inventory();break;case'shifts':html=shifts();break;case'accounts':html=accounts();break;case'receivables':case'payables':html=finance(ui.route);break;case'purchases':html=purchases();break;case'loyalty':html=loyalty();break;case'reports':html=reports();break;case'settings':case'design':case'printing':html=settings(ui.route);break;case'devices':html=devices();break;case'modules':html=modules();break;case'contacts':html=contacts();break;case'incidents':html=incidents();break;case'audit':html=auditView();break;case'updates':html=updates();break;case'catalog':html=catalog();break;case'checkout':html=checkout();break;case'buyer-account':html=buyerAccount();break;default:html=dashboard();}view.innerHTML=html;$('#viewContainer').style.zoom=ui.route==='pos'?ui.zoom:1;if(ui.route==='catalog')slideTimer=setInterval(()=>{if($('#modal').open)return;ui.slide=(ui.slide+1)%3;const f=document.activeElement;if(f?.matches('input'))return;renderView();},Math.max(2,Math.min(60,state.settings.sliderSeconds))*1000);if(ui.route==='checkout')updateCheckoutForm();}
let payContext=null;
function modal(title,body,foot=''){const d=$('#modal');d.innerHTML=`<header class="dialog-head"><h2 id="dialogTitle">${esc(title)}</h2>${ib('close','modal-close','Cerrar ventana')}</header><div class="dialog-body">${body}</div>${foot?`<footer class="dialog-foot">${foot}</footer>`:''}`;d.setAttribute('aria-labelledby','dialogTitle');if(!d.open)d.showModal();setTimeout(()=>d.querySelector('input:not([type=hidden]),textarea,select,button')?.focus(),20);}
function closeModal(){if($('#modal').open)$('#modal').close();payContext=null;}
function formError(form,text){const node=form.querySelector('.form-error')||document.createElement('p');node.className='form-error';node.setAttribute('role','alert');node.textContent=text;node.hidden=false;if(!node.parentNode)form.prepend(node);node.scrollIntoView({block:'nearest'});}
function confirmDialog(title,text,action,extra=''){modal(title,`<p class="small-text muted">${esc(text)}</p>`,btn('Cancelar','modal-close')+btn('Confirmar','confirm-'+action,'primary',extra));}
function onColor(hex){const value=hex.replace('#','');if(value.length!==6)return'#fff';const r=parseInt(value.slice(0,2),16),g=parseInt(value.slice(2,4),16),b=parseInt(value.slice(4,6),16);return(r*299+g*587+b*114)/1000>150?'#172d25':'#fff';}
async function imageFile(file){if(!file||!file.size)return null;if(file.size>25*1024*1024)throw Error('Elige una imagen de hasta 25 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Elige una imagen JPG, PNG o WebP.');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('No se pudo leer la imagen.'));r.readAsDataURL(file);});return await new Promise((ok,no)=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,1200/image.width),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);ok(canvas.toDataURL('image/webp',.78));};image.onerror=()=>no(Error('La imagen no se pudo abrir.'));image.src=data;});}
function syncTable(){if(state.tableId){const table=state.tables.find(t=>t.id===state.tableId);if(table){table.cart=JSON.parse(JSON.stringify(state.cart));table.status=state.cart.length?'occupied':'free';}}}
function holdCurrent(){if(!state.cart.length)return;if(state.tableId)syncTable();else{state.held??=[];state.held.push({id:uid('held'),name:'Venta en espera '+(state.held.length+1),cart:JSON.parse(JSON.stringify(state.cart)),customer:state.ticketCustomer});}state.cart=[];state.tableId=null;state.orderPayId=null;state.ticketCustomer='';}
function startSale(){holdCurrent();save();go('pos');toast('Nueva venta lista.');}
function activateTable(id,pay=false){holdCurrent();const table=state.tables.find(t=>t.id===id);if(!table)return;state.tableId=id;state.cart=JSON.parse(JSON.stringify(table.cart));table.status='occupied';table.opened??=Date.now();save();go('pos');if(pay&&state.cart.length)paymentDialog();}
function addLine(id,amount,options=[],scope='pos'){const p=state.products.find(p=>p.id===id);if(!p||!p.active)throw Error('Este producto ya no está disponible.');const cart=scope==='shop'?state.shopCart:state.cart;const existing=cart.filter(l=>l.productId===id).reduce((n,l)=>n+l.qty,0);checkQty(p,existing+amount);const key=options.join('|'),line=cart.find(l=>l.productId===id&&(l.options||[]).join('|')===key);if(line)line.qty=Math.round((line.qty+amount)*1000)/1000;else cart.push({productId:id,name:p.name,price:p.price,qty:amount,options});if(scope==='pos')syncTable();save();renderView();toast(p.name+' agregado'+(scope==='shop'?' a tu carrito': ' a la venta')+'.');}
function productDialog(id,scope='pos'){const p=state.products.find(p=>p.id===id);if(!p)return;const groups=p.id==='p7'?state.optionalGroups.filter(g=>['Tallas','Colores'].includes(g.name)):p.category==='Cocina'?state.optionalGroups.filter(g=>g.name==='Preparación'):[];modal(p.name,`<form id="productForm" data-id="${p.id}" data-scope="${scope}"><p class="form-error" hidden></p><div class="hstack" style="gap:20px;margin-bottom:20px"><img src="${img(p)}" alt="${esc(p.name)}" style="width:100px;height:110px;object-fit:contain"><div><p class="eyebrow">${esc(p.category)}</p><h3 style="font-size:23px;font-weight:500;margin:5px 0">${money(p.price)}${p.kind==='bulk'?' / kg':''}</h3><p class="small-text muted">${esc(p.description)}</p><span class="pill green">${number(p.stock)} ${p.kind==='bulk'?'kg':'unidades'} disponibles</span></div></div><label class="field">Cantidad ${p.kind==='bulk'?'en kg':''}<input class="input" type="number" name="quantity" value="${qty(p)}" min="${p.kind==='bulk'?.001:1}" step="${p.kind==='bulk'?.001:1}" required></label>${groups.map(g=>`<div style="margin-top:18px"><p class="small-text">${esc(g.name)} ${g.required?'<span class="muted">· Elige una opción</span>':''}</p><div class="check-options">${g.options.split(',').map(o=>`<label><input type="${g.required?'radio':'checkbox'}" name="option-${g.id}" value="${esc(o.trim())}" ${g.required?'required':''}>${esc(o.trim())}</label>`).join('')}</div></div>`).join('')}</form>`,btn('Cancelar','modal-close')+`<button class="btn primary" type="submit" form="productForm">Agregar ${icon('plus')}</button>`);}
function updateQuantity(index,scope,value){const cart=scope==='shop'?state.shopCart:state.cart,line=cart[index];if(!line)return;const p=state.products.find(p=>p.id===line.productId);if(!p)throw Error('El producto ya no está disponible.');if(value<=0){cart.splice(index,1);}else{const others=cart.filter((l,i)=>l.productId===p.id&&i!==index).reduce((n,l)=>n+l.qty,0);checkQty(p,others+value);line.qty=Math.round(value*1000)/1000;}if(scope==='pos')syncTable();save();renderView();}
function paymentDialog(){if(!state.cart.length)return toast('Agrega un producto antes de cobrar.');if(!currentShift())return modal('Abre tu turno para comenzar.','<p class="muted small-text">Tu caja debe tener un turno abierto para registrar el cobro.</p>',btn('Cancelar','modal-close')+btn('Abrir turno','shift-open','primary'));const order=state.orderPayId?state.orders.find(o=>o.id===state.orderPayId):null;const total=totals(state.cart,0,order?.fee||0).total;payContext={total,method:'Efectivo'};modal('Un buen cierre para tu venta.',`<form id="payForm"><p class="form-error" hidden></p><div class="pay-total"><small>Total a cobrar</small><strong>${money(total)}</strong></div><div class="pay-methods">${[['Efectivo','wallet'],['SINPE Móvil','link'],['Tarjeta','credit'],...(state.ticketCustomer?[['Crédito','users']]:[])].map(([m,i])=>`<button type="button" data-action="pay-method" data-method="${m}" class="${m==='Efectivo'?'active':''}">${icon(i)}${m}</button>`).join('')}</div><section id="cashInput"><label class="field">Efectivo recibido<input class="input" type="number" name="received" min="${total}" step="1" value="${total}"></label><div class="quick-amounts">${[total,Math.ceil(total/5000)*5000,Math.ceil(total/10000)*10000].filter((v,i,a)=>a.indexOf(v)===i).map(v=>btn(money(v),'cash-amount','small',`data-amount="${v}"`)).join('')}</div><div class="summary-row total" style="margin-top:20px"><span>Tu cambio</span><strong id="cashChange">${money(0)}</strong></div></section><p id="paymentHint" class="small-text muted" hidden>Registra el pago confirmado en la cuenta Banco / SINPE.</p></form>`,btn('Volver a la venta','modal-close')+'<button class="btn primary" type="submit" form="payForm">Confirmar cobro '+icon('check')+'</button>');}
function makeSale(items,total,method,customer,orderId=null){const aggregate={};for(const l of items)aggregate[l.productId]=(aggregate[l.productId]||0)+l.qty;for(const [id,value] of Object.entries(aggregate)){const p=state.products.find(p=>p.id===id);if(!p)throw Error('Un producto ya no está disponible.');checkQty(p,value);}if(method==='Crédito'){if(!customer)throw Error('Selecciona un cliente con crédito antes de cobrar.');if(customer.credit+total>customer.limit)throw Error('El importe supera el crédito disponible del cliente.');}for(const [id,value] of Object.entries(aggregate)){const p=state.products.find(p=>p.id===id);p.stock=Math.round((p.stock-value)*1000)/1000;}const sale={id:uid('sale'),number:'VT-'+String(871+state.sales.length),customer:customer?.name||'Cliente de contado',total,items:JSON.parse(JSON.stringify(items)),method,at:Date.now(),shiftId:currentShift()?.id||null,branchId:'b1',orderId};state.sales.push(sale);if(method==='Crédito')customer.credit+=total;else{const account=state.accounts.find(a=>a.id===(method==='Efectivo'?'cash':'bank'));account.balance+=total;state.ledger.push({id:uid('ledger'),name:'Venta '+sale.number,accountId:account.id,amount:total,at:Date.now()});}if(customer&&state.settings.points)customer.points+=Math.floor(total/100);if(orderId){const order=state.orders.find(o=>o.id===orderId);order.paid=true;order.events.push({label:'Pago confirmado',at:Date.now()});}log('Venta completada',sale.number+' · '+money(total)+' · '+method);return sale;}
function receiptDialog(id,change=0){const sale=state.sales.find(s=>s.id===id);if(!sale)return;modal('Venta completada',`<article class="receipt"><header><p class="eyebrow">${esc(state.settings.name)}</p><h3>Gracias por elegirnos.</h3><p class="small-text muted">${esc(sale.number)} · ${stamp(sale.at)}</p><p class="small-text">${esc(sale.customer)}</p></header><table>${sale.items.map(l=>`<tr><td>${number(l.qty)} × ${esc(l.name)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table><div class="summary-row total"><span>Total</span><b>${money(sale.total)}</b></div><div class="summary-row"><span>Pago</span><b>${esc(sale.method)}</b></div>${sale.method==='Efectivo'?`<div class="summary-row"><span>Cambio</span><b>${money(change)}</b></div>`:''}<footer>Comprobante de demostración · impuestos incluidos<br>Que tengas un bonito día.</footer></article>`,btn(icon('printer')+'Imprimir','print')+btn('Continuar','modal-close','primary'));}
function stepOrder(id){const o=state.orders.find(o=>o.id===id);if(!o)return;if(o.status==='Nuevo')o.status='Preparando';else if(o.status==='Preparando')o.status='Preparado';else return;const note=o.status==='Preparando'?'Pedido aceptado · comanda preparada':'Pedido preparado';o.events.push({label:note,at:Date.now()});log(note,o.number);save();renderView();if(o.status==='Preparando'&&state.settings.autoPrint)modal('Comanda preparada',`<article class="receipt"><header><p class="eyebrow">${esc(state.settings.name)} · COCINA</p><h3>${esc(o.number)}</h3><p>${esc(o.customer)}</p></header>${o.items.map(l=>`<p>${number(l.qty)} × ${esc(l.name)}</p>`).join('')}<p class="muted small-text">Aceptado ${stamp()}</p></article>`,btn(icon('printer')+'Imprimir comanda','print')+btn('Continuar','modal-close','primary'));else toast(note+'.');}
function dispatch(id){const o=state.orders.find(o=>o.id===id);modal('Coordinar el Express',`<form id="dispatchForm" data-id="${id}"><p class="form-error" hidden></p><p class="small-text muted">${esc(o.number)} · ${esc(o.customer)} · ${money(o.fee)} de envío</p><div class="check-options"><label><input type="radio" name="mode" value="pool" checked>Ofrecer a todos los afiliados</label><label><input type="radio" name="mode" value="direct">Asignar a un motorizado</label></div><label class="field" style="margin-top:18px">Motorizado<select name="driver" class="input">${state.drivers.filter(d=>d.available).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label></form>`,btn('Cancelar','modal-close')+'<button class="btn primary" type="submit" form="dispatchForm">Asignar Express</button>');}
function financialDialog(kind,id){const receivable=kind==='receivables',row=receivable?state.customers.find(c=>c.id===id):state.purchases.find(p=>p.id===id),amount=receivable?row.credit:row.due;modal(receivable?'Registrar abono':'Registrar pago',`<form id="financeForm" data-kind="${kind}" data-id="${id}"><p class="form-error" hidden></p><p class="small-text muted">${esc(receivable?row.name:row.provider)} · saldo ${money(amount)}</p><div class="fields">${fieldHtml(['amount','Monto','number',true],{amount})}<label class="field">${receivable?'Ingresar en':'Pagar desde'}<select class="input" name="account">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${money(a.balance)}</option>`).join('')}</select></label></div></form>`,btn('Cancelar','modal-close')+'<button class="btn primary" type="submit" form="financeForm">Confirmar</button>');}
function updateCheckoutForm(){const f=$('#checkoutForm');if(!f)return;const delivery=f.delivery.value==='delivery';$('#addressFields').hidden=!delivery;f.address.required=delivery;const proof=f.payment.value==='SINPE Móvil';$('#proofField').hidden=!proof;f.proof.required=proof;const fee=delivery?1500:0;$('#checkoutFee').textContent=fee?money(fee):'Sin cargo por retiro';$('#checkoutTotal').textContent=money(totals(state.shopCart,0,fee).total);const phone=f.phone.value.replace(/\D/g,''),customer=state.customers.find(c=>c.phone.replace(/\D/g,'')===phone),box=$('#savedAddresses');if(customer&&delivery){box.hidden=false;box.innerHTML=`<label class="field">Tus direcciones guardadas<select class="input" id="savedAddress"><option value="">Escribir otra dirección</option>${(customer.addresses||[customer.address]).filter(Boolean).map(a=>`<option>${esc(a)}</option>`).join('')}</select></label>`;}else{box.hidden=true;box.innerHTML='';}}
function buyerLogin(){modal('Bienvenido de vuelta.',`<form id="buyerLoginForm"><p class="form-error" hidden></p><p class="small-text muted">Para explorar usa el cliente de ejemplo <b>88881111</b> y la misma contraseña.</p><div class="fields">${fieldHtml(['phone','Teléfono','tel',true],{})}${fieldHtml(['password','Contraseña','password',true],{})}</div></form>`,btn('Cancelar','modal-close')+'<button class="btn primary" type="submit" form="buyerLoginForm">Iniciar sesión</button>');}
function exportData(kind){let rows;if(kind==='orders')rows=state.orders.map(o=>({pedido:o.number,cliente:o.customer,telefono:o.phone,estado:o.status,total:o.total+o.fee,fecha:stamp(o.created)}));else if(kind==='sales')rows=(ui.route==='reports'?reportSales():state.sales).map(s=>({venta:s.number,cliente:s.customer,metodo:s.method,total:s.total,fecha:stamp(s.at)}));else if(kind==='audit')rows=state.audit.map(a=>({accion:a.event,detalle:a.detail,fecha:stamp(a.at)}));else{const cfg=entities[kind]||entities.products;rows=state[cfg.store].map(r=>Object.fromEntries(cfg.columns.map(([k,l])=>[l,r[k]])));}if(!rows.length)return toast('No hay registros para exportar.');download('fisitaap-'+kind+'.csv',csv(rows),'text/csv;charset=utf-8');toast('Archivo preparado.');}
function csv(rows){const keys=Object.keys(rows[0]),cell=v=>{let text=String(v??'');if(typeof v==='string'&&/^[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';};return '\uFEFF'+[keys.map(cell).join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if(c==='\n'&&!quoted){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}if(quoted)throw Error('Hay comillas sin cerrar en el CSV.');return rows.filter(r=>r.some(v=>v.trim()));}
function importDialog(){modal('Carga simple de productos',`<form id="importForm"><p class="form-error" hidden></p><p class="small-text muted">Carga un CSV con nombre, código, categoría, precio, existencias y tipo. Puedes abrir y guardar el machote con Excel.</p><label class="field">Archivo CSV<input class="input" type="file" name="file" accept=".csv,text/csv" required></label><div class="notice" style="margin-top:16px">Hasta 500 productos. Las unidades requieren cantidades enteras; granel admite tres decimales.</div></form>`,btn('Descargar machote CSV','template')+btn('Cancelar','modal-close')+'<button class="btn primary" type="submit" form="importForm">Importar productos</button>');}
function guide(){modal('Un espacio para explorar',`<div class="stack"><section><p class="eyebrow">Todo empieza con una buena experiencia</p><h3 style="font-family:var(--font-title);font-size:23px;font-weight:500">${esc(CONFIG.name)}</h3><p class="small-text muted">${esc(CONFIG.description)}</p></section><section><h3 class="small-text">Prueba un recorrido completo</h3><ol class="small-text muted" style="line-height:2;padding-left:18px"><li>En Negocio, crea un producto y realiza una venta.</li><li>En Catálogo, agrega productos y confirma un pedido.</li><li>Regresa a Negocio → Pedidos para aceptarlo y prepararlo.</li><li>Asigna su Express y cambia a Moto para completar la entrega.</li><li>En Mis pedidos del Catálogo encontrarás su PIN.</li><li>En Maestro, administra los negocios y sus planes de ejemplo.</li></ol></section><p class="notice">Esta demostración funciona con datos de ejemplo guardados en tu navegador. Los pagos, mensajes, dispositivos e IA no se conectan a servicios reales.</p></div>`,btn('Empezar a explorar','modal-close','primary'));}
function chatReply(text){const q=text.toLowerCase(),scope=ui.mode;if(/sistema (igual|similar)|programa|poema|chatgpt|ignora/.test(q))return scope==='master'?'Te ayudo a administrar FISITAAP: negocios, planes y contactos. ¿Qué revisamos?':scope==='catalog'?'Te ayudo con los productos y pedidos de La Ventanita. ¿Qué deseas encontrar?':'Te ayudo a operar tu negocio en FISITAAP. Podemos revisar ventas, pedidos o inventario.';if(scope==='master'){if(/plan|venc/.test(q))return state.tenants.map(t=>t.name+' · '+t.plan+' · vence '+t.expires).join('\n')+'\nPuedes revisar y editar cada cuenta en Negocios.';if(/contact|mensaje/.test(q))return 'Tienes '+state.contacts.filter(c=>c.status==='Nuevo').length+' contactos nuevos. Abre Contactos para atenderlos.';return 'Tu plataforma tiene '+state.tenants.length+' negocios, '+state.tenants.filter(t=>t.active).length+' activos y '+state.devices.length+' equipos de ejemplo. Puedo ayudarte con planes, vencimientos y contactos.';}if(scope==='catalog'){if(/hora|contact|telefono|direcci/.test(q))return state.settings.name+'\n'+state.settings.address+'\nTeléfono: '+state.settings.phone+'\nHorario de ejemplo: lunes a sábado, 8 a. m. a 6 p. m.';if(/pedido|pin|entrega/.test(q)){const orders=state.orders.filter(o=>o.phone===state.buyer?.phone);return orders.length?orders.map(o=>o.number+' · '+o.status).join('\n')+'\nTu PIN está en Mis pedidos.':'Agrega tus favoritos al carrito y confirma nombre, teléfono, entrega y pago.';}return 'En La Ventanita puedes elegir '+state.products.slice(0,3).map(p=>p.name+' ('+money(p.price)+')').join(', ')+'.\nEncuentra las opciones en el catálogo y agrégalas a tu carrito.';}if(scope==='driver')return 'Tienes '+state.orders.filter(o=>o.driverId==='d1'&&!['Entregado','Cancelado'].includes(o.status)).length+' entregas en curso y '+money(state.drivers[0].balance)+' por recibir. El PIN del cliente confirma la entrega.';if(/stock|inventario|producto/.test(q))return state.products.filter(p=>p.stock<=p.minimum).map(p=>p.name+': '+number(p.stock)+' disponibles.').join('\n')||'Tus productos tienen existencias sobre su mínimo. Puedes ajustar cantidades en Inventario.';if(/venta|vend|caja|ingreso/.test(q))return 'Hoy registraste '+state.sales.length+' ventas por '+money(state.sales.reduce((n,s)=>n+s.total,0))+'.\nLa caja '+(currentShift()?'está abierta.':'está cerrada.')+' Puedes ver el detalle en Reportes.';if(/pedido|cocina/.test(q))return 'Tienes '+state.orders.filter(o=>o.status==='Nuevo').length+' pedidos nuevos. En Pedidos puedes aceptarlos, prepararlos y coordinar su entrega.';return 'Hola, Valeria. Te ayudo a revisar las ventas, pedidos e inventario de esta demostración. ¿Qué necesitas consultar?';}
function renderChat(){const scope=ui.mode,title=scope==='master'?'Tu asistente de plataforma':scope==='catalog'?'Asistente de La Ventanita':scope==='driver'?'Tu asistente de ruta':'Tu asistente del negocio';$('#chatHost').innerHTML=`${ui.mode==='catalog'&&state.shopCart.length?'':`<button class="chat-launch" data-action="chat">${icon('chat')}FISIChat</button>`}<section class="chat" id="chat" ${ui.chat?'':'hidden'} aria-label="FISIChat"><header><span class="avatar">${icon('chat')}</span><div class="flex1"><b>FISIChat</b><small>${title}</small></div>${ib('refresh','chat-reset','Nueva conversación')}${ib('close','chat-close','Cerrar chat')}</header><div class="chat-messages" id="chatMessages"><p class="chat-message">${esc(scope==='master'?'Hola. Revisemos negocios, planes y contactos.':scope==='catalog'?'Hola. Te ayudo a encontrar tu favorito y a seguir tus pedidos.':scope==='driver'?'Hola, Andrés. Revisemos tus entregas y ganancias.':'Hola, Valeria. Tu negocio, claro y al día. ¿Qué revisamos?')}</p>${ui.chatHistory.map(m=>`<p class="chat-message ${m.role==='user'?'user':''}">${esc(m.text)}</p>`).join('')}</div><form id="chatForm"><label class="screen-reader" for="chatInput">Tu mensaje</label><input id="chatInput" class="input" name="message" placeholder="Escribe tu consulta…" required maxlength="500">${ib('send','chat-send','Enviar mensaje')}</form></section>`;if(ui.chat){const messages=$('#chatMessages');messages.scrollTop=messages.scrollHeight;}}
function commandDialog(query=''){modal('¿A dónde quieres ir?',`<label class="screen-reader" for="commandInput">Buscar una sección</label><input class="input" id="commandInput" placeholder="Productos, pedidos, inventario…" value="${esc(query)}"><div id="commandResults" style="margin-top:15px"></div>`,btn('Cerrar','modal-close'));commandResults(query);$('#commandInput').focus();}
function commandResults(q){const links=navigation().flatMap(g=>g[1]).filter(l=>l[1].toLowerCase().includes(q.toLowerCase()));$('#commandResults').innerHTML=links.map(([r,l,i])=>`<button class="nav-link" data-action="command-route" data-route="${r}">${icon(i)}${esc(l)}<span class="right muted">↵</span></button>`).join('')||'<p class="small-text muted">Prueba con el nombre de una sección.</p>';}
function genericForm(title,id,fields,foot='Confirmar'){modal(title,`<form id="${id}"><p class="form-error" hidden></p><div class="fields">${fields}</div></form>`,btn('Cancelar','modal-close')+`<button class="btn primary" type="submit" form="${id}">${esc(foot)}</button>`);}
function saveAndRender(message){save();closeModal();renderNav();renderView();renderChat();if(message)toast(message);}

 ticket.querySelector('.ticket-lines').insertAdjacentHTML('beforebegin','<div class="invoice-columns"><span>Producto</span><span>Cantidad</span><span>Precio</span><span>Importe</span></div>');
 const filters=products.querySelector('.filter-bar');filters.querySelector('select').remove();
 products.insertAdjacentHTML('afterbegin',`<header class="quick-heading"><div><p class="eyebrow">CATÁLOGO</p><h2>Carga rápida</h2></div><span class="pill">${state.products.filter(p=>p.active).length} productos</span></header>`);
 filters.insertAdjacentHTML('afterend',`<div class="quick-categories" aria-label="Categorías de carga rápida">${['Todos',...state.categories.map(c=>c.name)].map(c=>`<button class="chip ${ui.category===c?'active':''}" data-action="category" data-category="${esc(c)}" aria-pressed="${ui.category===c}">${c==='Todos'?icon('overview'):icon(c==='Bebidas'?'gift':'bag')}<span>${esc(c)}</span></button>`).join('')}</div>`);
 const tabs=root.querySelector('.pos-mobile-tabs');tabs.prepend(tabs.querySelector('[data-tab=ticket]'));tabs.querySelector('[data-tab=ticket]').innerHTML=`Facturación · ${money(totals(state.cart).total)}`;
 return template.innerHTML;
};
function hybridFurniture(t,index){
 const occupied=t.status==='occupied',color=occupied?'#427dac':'#779b79',shape=index%3===1?'round':index%3===2?'rectangle':'square';
 const seats=Math.max(2,Math.min(8,t.seats));let chairs='';
 for(let i=0;i<seats;i++){const angle=360*i/seats;chairs+=`<g transform="translate(60 60) rotate(${angle})"><rect x="-14" y="-54" width="28" height="28" rx="8" fill="${color}" stroke="#526b68" stroke-width="1"/><path d="M-11-47Q0-52 11-47" fill="none" stroke="#ffffff90" stroke-width="2"/></g>`;}
 const top=shape==='round'?'<circle cx="60" cy="60" r="37" fill="url(#hy-wood)" stroke="#ab8862"/>':`<rect x="${shape==='rectangle'?15:24}" y="24" width="${shape==='rectangle'?90:72}" height="72" rx="9" fill="url(#hy-wood)" stroke="#ab8862"/>`;
 return `<g filter="url(#hy-shadow)">${chairs}${top}<circle cx="60" cy="60" r="16" fill="#fffefa"/><text x="60" y="65" text-anchor="middle" fill="#173c57" font-size="13" font-weight="650">${esc(t.name.replace(/^mesa\s*/i,''))}</text></g>`;
}
function hybridPlant(x,y){return `<g transform="translate(${x} ${y})"><circle r="19" fill="#e9e1d0"/><ellipse rx="10" ry="23" transform="rotate(45)" fill="#71997c"/><ellipse rx="10" ry="23" transform="rotate(-45)" fill="#95b29c"/><ellipse rx="8" ry="21" fill="#527f60"/></g>`;}
function hybridFloor(rows){
 const main=state.tables.filter(t=>t.room!=='Terraza').length,terrace=state.tables.filter(t=>t.room==='Terraza').length,height=Math.max(570,125+(Math.ceil(main/3)-1)*197+205,147+(terrace-1)*195+205);
 return `<div class="floor-viewport"><svg class="hybrid-floor" viewBox="0 0 1000 ${height}" style="width:${ui.floorZoom*100}%;height:${ui.floorZoom*100}%" aria-label="Plano interactivo de mesas, salón principal y terraza"><defs><linearGradient id="hy-wood" x2=".8" y2="1"><stop stop-color="#e5ceb0"/><stop offset="1" stop-color="#c0a07a"/></linearGradient><pattern id="hy-tiles" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#dedfd8" stroke-width=".7"/></pattern><pattern id="hy-deck" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#f0eadf"/><path d="M0 0H28M0 28H28" stroke="#ded4c4" stroke-width="1"/></pattern><filter id="hy-shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#2f4334" flood-opacity=".13"/></filter></defs><rect width="1000" height="${height}" fill="#fafbf9"/><rect x="25" y="55" width="640" height="${height-100}" rx="8" fill="#f5f4ee"/><rect x="25" y="55" width="640" height="${height-100}" rx="8" fill="url(#hy-tiles)"/><rect x="700" y="55" width="275" height="${height-100}" rx="8" fill="url(#hy-deck)"/><path d="M665 ${height-45}V55H25V${height-45}H260M340 ${height-45}H665" fill="none" stroke="#a9b4b7" stroke-width="7"/><path d="M700 55H975V${height-45}H700" fill="none" stroke="#c1b69f" stroke-width="4"/><path d="M260 ${height-45}V${height-125}A80 80 0 0 1 340 ${height-45}" fill="none" stroke="#b2bdbd" stroke-width="1.5"/><text x="300" y="${height-18}" text-anchor="middle" fill="#7e8c8e" font-size="11" letter-spacing="2">ENTRADA</text><text x="35" y="32" fill="#60747b" font-size="12" letter-spacing="2">SALÓN PRINCIPAL</text><text x="711" y="32" fill="#60747b" font-size="12" letter-spacing="2">TERRAZA</text><rect x="90" y="52" width="145" height="8" rx="3" fill="#b9d5df"/><rect x="430" y="52" width="145" height="8" rx="3" fill="#b9d5df"/>${hybridPlant(60,95)}${hybridPlant(630,95)}${hybridPlant(737,95)}${hybridPlant(940,height-85)}${rows.map((t)=>{const idx=state.tables.indexOf(t),terrace=t.room==='Terraza',roomRows=state.tables.filter(v=>v.room===t.room),n=roomRows.indexOf(t),x=terrace?778:82+(n%3)*193,y=terrace?147+Math.floor(n)*195:125+Math.floor(n/3)*197,status=t.status==='occupied'?'Ocupada':'Disponible',sel=ui.table===t.id;return `<g class="floor-table ${sel?'selected':''}" data-action="table-select" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.name)} · ${status} · ${t.seats} personas" transform="translate(${x} ${y})"><title>${esc(t.name)} · ${status}</title><rect class="floor-selection" x="-8" y="-8" width="136" height="163" rx="13"/>${hybridFurniture(t,idx)}<rect x="-2" y="124" width="124" height="31" rx="6" fill="${t.status==='occupied'?'#e4eef8':'#e6f0e7'}"/><text x="60" y="137" font-size="10" font-weight="600" text-anchor="middle" fill="${t.status==='occupied'?'#315d85':'#477453'}">${status}</text><text x="60" y="149" font-size="9" text-anchor="middle" fill="#65787d">${t.status==='occupied'?money(totals(t.cart).total):t.seats+' personas'}</text></g>`;}).join('')}</svg></div>`;
}
const lineaTables=tables;
tables=function(){
 const visible=state.tables.filter(t=>ui.room==='Todos'||t.room===ui.room);
 if(ui.table&&!visible.some(t=>t.id===ui.table))ui.table=visible[0]?.id||null;
 const template=document.createElement('template');template.innerHTML=lineaTables();const root=template.content;
 root.querySelector('h1').textContent='Mesas y caja';root.querySelector('.page-heading p:not(.eyebrow)').textContent='Tu salón, de un vistazo. Selecciona una mesa para abrir o continuar su cuenta.';
 const rows=state.tables.filter(t=>ui.room==='Todos'||t.room===ui.room),panel=root.querySelector('.tables-layout>section');
 panel.classList.add('floor-card');panel.innerHTML=`<header class="floor-toolbar"><div class="hstack"><span class="floor-legend"><i></i>Disponible</span><span class="floor-legend busy"><i></i>Ocupada</span></div><div class="hstack"><button class="btn small" data-hybrid="floor-zoom" data-delta="-.2" aria-label="Alejar plano" ${ui.floorZoom<=1?'disabled':''}>−</button><button class="btn small" data-hybrid="floor-reset" aria-label="Ajustar plano a la pantalla">${Math.round(ui.floorZoom*100)} %</button><button class="btn small" data-hybrid="floor-zoom" data-delta=".2" aria-label="Acercar plano" ${ui.floorZoom>=1.8?'disabled':''}>+</button></div></header>${hybridFloor(rows)}<footer class="floor-hint">${icon('table')}Vista gráfica · ${rows.length} mesas${btn('Pedidos web · '+state.orders.filter(o=>o.status==='Nuevo').length,'incoming','small')}</footer>`;
 if(!ui.table)root.querySelector('.floor-table')?.classList.add('selected');
 return template.innerHTML;
};
document.addEventListener('click',event=>{const button=event.target.closest('[data-hybrid]');if(!button)return;if(button.dataset.hybrid==='floor-zoom')ui.floorZoom=Math.round(Math.max(1,Math.min(1.8,ui.floorZoom+Number(button.dataset.delta)))*10)/10;else ui.floorZoom=1;renderView();});
document.addEventListener('keydown',event=>{const table=event.target.closest('.floor-table');if(table&&['Enter',' '].includes(event.key)){event.preventDefault();ui.table=table.dataset.id;renderView();}});

shell();$('#navigation').inert=true;
if(['#pos','#tables','#catalog'].includes(location.hash)){if(location.hash==='#catalog')mode('catalog');else go(location.hash.slice(1));}
})();
</script></body></html>
